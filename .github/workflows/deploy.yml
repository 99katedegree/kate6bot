name: Fly Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # GitHub Secrets を Fly の secrets に反映する（値は .env から `deno task sync-env` で登録）
      - name: Sync secrets to Fly
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: |
          printf '%s\n' \
            "DISCORD_TOKEN=$DISCORD_TOKEN" \
            "TURSO_URL=$TURSO_URL" \
            "TURSO_TOKEN=$TURSO_TOKEN" \
            | flyctl secrets import --stage
      - run: flyctl deploy --remote-only --ha=false
      # 週次cronが二重実行されないよう、常に1台に矯正する(待機マシンなどが増えていたら削除される)
      - run: flyctl scale count 1 --yes --app fly-kate6bot
